services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acadmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-acadmate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - acadmate-pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acadmate} -d ${POSTGRES_DB:-acadmate}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  acadmate-pg:
